version: 1.1
name: PEFY-Upstream-Watchlist
auto_discovery:
  enabled: true
  scope: accessible_owned_repositories
  include_forks: true
  classify_divergence: [U0_CLEAN, U1_BEHIND_ONLY, U2_AHEAD_ONLY, U3_DIVERGED, U4_ORPHANED_ARCHIVED_MOVED]

critical_upstreams:
  - component: DeepSeek Harness
    upstream: deepseek-ai/deepseek-harness
    local_integration: yemanlin1st/GenAI_Agents:skills/deepseek-harness
    tracking_mode: repository_commits_tags_manifests_security
    maturity: developer_preview
    license: MIT
    policy:
      version_pin_before_production_like_use: true
      sandbox_validation: true
      rollback_required: true
      trajectory_privacy_review: true

  - component: TrueForge
    upstream: truefoundry/trueforge
    local_integration: yemanlin1st/GenAI_Agents:skills/trueforge
    package_baseline:
      "@truefoundry/trueforge": "0.1.4"
      "@truefoundry/trueforge-sdk": "0.1.3"
      "@truefoundry/trueforge-ui": "0.2.4"
    tracking_mode: repository_releases_packages_commits_security_runtime_requirements
    license: MIT
    treatment: governed_subordinate_harness
    policy:
      pin_versions: true
      localhost_only_for_local_mode: true
      hosted_auth_required_for_shared_use: true
      sandbox_validation: true
      rollback_required: true
      mcp_and_skill_provenance_review: true
      secrets_externalized: true

  - component: Three.js
    upstream: mrdoob/three.js
    local_integration: yemanlin1st/GenAI_Agents:skills/threejs
    package: three
    package_baseline: "0.185.1"
    tracking_mode: releases_packages_commits_security_browser_compatibility
    license: MIT
    treatment: optional_spatial_visualization_engine
    policy:
      pin_versions: true
      lazy_load_by_default: true
      accessibility_fallback_required: true
      mobile_performance_gate: true
      asset_supply_chain_review: true

  - component: CrewAI
    local_repository: yemanlin1st/crewAI
    upstream: crewAIInc/crewAI
    default_branch: main
    verified_state_2026_08_25:
      divergence: U1_BEHIND_ONLY
      ahead_by: 0
      behind_by: 543
    treatment: controlled_sync_candidate

  - component: DeerFlow
    local_repository: yemanlin1st/deer-flow
    upstream: bytedance/deer-flow
    default_branch: main
    verified_state_2026_08_25:
      divergence: U1_BEHIND_ONLY
      ahead_by: 0
      behind_by: 1353
    treatment: migration_scale_sync

  - component: n8n
    local_repository: yemanlin1st/n8n
    upstream: n8n-io/n8n
    default_branch: master
    verified_state_2026_08_25:
      divergence: U1_BEHIND_ONLY
      ahead_by: 0
      behind_by: 7640
    treatment: migration_scale_sync
    special_checks: [license, runtime_requirements, database_migrations, workflow_compatibility, credentials, community_nodes]

reference_sources:
  - component: Claude Fable 5 structure benchmark
    authoritative_product_source: anthropic.com
    structural_capture_sources:
      - asgeirtj/system_prompts_leaks:Anthropic/Official/2026-06-09-claude-fable-5.md
      - A3S-Lab/claude-fable-5:claude-fable-5.md
    local_integration: yemanlin1st/GenAI_Agents:skills/fable5-structure
    treatment: architecture_reference_only
    policy:
      do_not_impersonate_runtime: true
      do_not_copy_provider_identity_claims: true
      do_not_use_permission_bypass_flags: true
      preserve_platform_safety: true
      verify_current_product_facts: true

monitor_signals:
  - releases
  - tags
  - default_branch_commits
  - package_registry_versions
  - security_advisories
  - cves
  - breaking_changes
  - deprecations
  - license_changes
  - runtime_requirements
  - schema_migrations
  - plugin_api_changes
  - performance_fixes
  - upstream_archive_or_transfer
  - fork_ahead_behind_drift

change_rules:
  - never_auto_merge_major_change
  - never_force_push_unclassified_local_work
  - preserve_local_pefy_ip
  - prefer_backport_for_critical_security_when_full_convergence_blocked
  - require_tests_benchmarks_security_and_rollback_before_promotion
