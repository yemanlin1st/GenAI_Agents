qualification_patterns:
  immutable_upstream_base:
    use_when: upstream_PR_workflows_load_trusted_actions_or_policy_from_base_SHA
    method:
      - create_immutable_base_branch_at_exact_upstream_head
      - create_qualification_head_from_same_SHA
      - add_nonproduction_trigger_commit_to_head_only
      - open_qualification_PR_head_to_immutable_base
      - collect_evidence
      - never_merge_trigger_PR
    benefit: distinguishes_upstream_runtime_failure_from_historical_fork_CI_incompatibility
  fork_provenance:
    invariant: canonical_vendor_identity_and_PEFY_fork_identity_are_recorded_separately
    forbidden:
      - wildcard_repository_acceptance
      - disabling_SHA_or_digest_checks
      - retagging_PEFY_commits_with_vendor_tag_names
      - suppressing_historical_upgrade_tests_due_to_missing_fork_history

rules:
  - workflow_success_with_substantive_jobs_skipped_is_not_qualification_success
  - metadata_only_CI_must_not_satisfy_runtime_security_or_performance_gates
  - CI_failure_before_test_execution_must_be_classified_as_harness_or_tooling_failure_not_product_failure
  - downstream_artifact_or_coverage_upload_failure_must_not_erase_successful_underlying_test_evidence
  - static_growth_guardrails_must_use_the_intended_PR_or_immutable_base_not_historical_fork_main
  - upstream_workflow_trusted_actions_must_match_the_upstream_baseline_under_test
  - raw_development_dependency_audit_output_must_not_override_a_passed_reviewed_production_graph_audit_without_dependency_level_evidence
  - DCO_or_other_legal_attestations_require_authorized_human_action
  - no_component_is_promoted_without_reproducible_runtime_evidence
