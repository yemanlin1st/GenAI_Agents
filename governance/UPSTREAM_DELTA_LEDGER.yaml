version: 1.4
purpose: >-
  Registry for preserving intentional PEFY deltas from externally-derived repositories.
  Entries are evidence records, not automatic upgrade permissions. Multi-hop fork
  chains retain parent, canonical source and tracked-upstream relationships.

states:
  U0: clean
  U1: behind_only
  U2: ahead_only
  U3: diverged
  U4: orphaned_moved_archived

conflict_classes:
  C0: generated_or_formatting
  C1: dependency_or_lockfile
  C2: configuration
  C3: api_schema_migration
  C4: security_auth_identity
  C5: business_logic_or_ip

