version: 2.1
profile: PEFY-OMEGA-STRUCTURE
status: active_governed_runtime
qualification_state: ci_validated_target_environment_unqualified
supervisory_control_plane: METAPEFYON_OMEGA
base_governance:
  - governance/PEFY_AI_MASTER_CONTINUOUS_IMPROVEMENT_PROMPT.md
  - governance/PEFY_OMEGA_STRUCTURE_SYSTEM_V2.md
  - governance/PEFY_AI_CONTINUOUS_IMPROVEMENT_LOOPS.yaml
  - governance/UPSTREAM_MANAGEMENT_POLICY.md
  - governance/UPSTREAM_WATCHLIST.yaml

instruction_modules:
  mandatory:
    - sovereign_constitution
    - runtime_identity_truth
    - epistemic_freshness
    - task_risk_classifier
    - output_contract
    - safety_compliance_trust
    - observability_evidence
    - resilience_recovery
  deferred_by_default:
    - fable5_structure_adapter
    - trueforge_harness_adapter
    - threejs_spatial_visualization
    - deepseek_harness
    - domain_specific_skills

capabilities:
  fable5_structure_adapter:
    path: skills/fable5-structure/SKILL.md
    role: architecture_reference
    precedence: below_pefy_governance
  trueforge_harness_adapter:
    path: skills/trueforge/SKILL.md
    role: subordinate_agent_harness
    precedence: below_metapefyon
    package: "@truefoundry/trueforge@0.1.4"
    sdk: "@truefoundry/trueforge-sdk@0.1.3"
  threejs_spatial_visualization:
    path: skills/threejs/SKILL.md
    role: optional_spatial_ui
    package: "three@0.185.1"
    lazy_load: true
    critical_workflow_fallback_required: true

runtime_baseline:
  version: "0.2.0"
  package_manifest: integrations/pefy-extension-runtime/package.json
  capability_registry: integrations/pefy-extension-runtime/config/capabilities.json
  executable_entrypoint: integrations/pefy-extension-runtime/src/index.mjs
  test_suite: integrations/pefy-extension-runtime/test/runtime.test.mjs
  provisioner: scripts/provision_pefy_extension_runtime.sh
  node_minimum: "22.13.0"
  ci_workflow: .github/workflows/omega-structure-validation.yml

validated_capabilities:
  - deterministic_task_risk_classification
  - approval_requirement_derivation
  - policy_driven_capability_routing
  - dynamic_instruction_module_selection
  - execution_envelope_assembly
  - trueforge_sdk_import
  - trueforge_loopback_default
  - threejs_lazy_import
  - threejs_low_resource_fallback

promotion_gates:
  - provenance_verified
  - versions_pinned
  - license_reviewed
  - secrets_externalized
  - least_privilege
  - sandbox_or_isolation_validated
  - interoperability_tests_pass
  - security_tests_pass
  - performance_baseline_recorded
  - rollback_available
  - target_environment_evidence

activation_policy:
  dynamic_prompt_assembly: true
  deferred_skill_loading: true
  benchmark_driven_harness_selection: true
  no_uncontrolled_mass_installation: true
  no_runtime_impersonation: true
  no_default_permission_bypass: true
  production_qualification_requires_target_environment_evidence: true
