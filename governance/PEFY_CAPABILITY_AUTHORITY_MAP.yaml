version: 1.1
name: PEFY Capability Authority Map
purpose: >-
  Prevent duplicate orchestration, uncontrolled framework proliferation and ambiguous
  decision authority across the PEFY AI/agentic ecosystem. Components are assigned
  explicit roles. A subordinate runtime may execute work but may not silently become
  the sovereign control plane.

authority_tiers:
  A0_PRINCIPAL:
    authority: final_human_decision
    may_override: all_subject_to_law_security_and_recorded_risk_acceptance

  A1_SOVEREIGN_CONTROL:
    components:
      - MƐTAPEFYON_Ω
      - MƐTAFLOW_Ω
      - PEA
    authority:
      - intent_interpretation
      - policy_routing
      - council_selection
      - execution_runtime_selection
      - approval_gate_enforcement
      - evidence_and_release_state
    rule: exactly_one_sovereign_control_path_per_work_item

  A2_GOVERNANCE_SECURITY_ASSURANCE:
    components:
      - council_fabric
      - counsellors
      - AGENT_MANAGER
      - red_team_review
      - security_privacy_review
      - compliance_ip_review
      - release_change_control
      - independent_verifiers
    authority:
      - challenge
      - capability_admission_and_lifecycle_review
      - block_on_defined_gates
      - quarantine_or_downgrade_subordinate_capabilities
      - validate
      - record_dissent
    rules:
      - advisory_or_gatekeeping_not_parallel_sovereign_orchestration
      - Agent_Manager_is_mandatory_for_material_agent_tool_skill_harness_or_runtime_admission
      - Agent_Manager_cannot_fabricate_or_bypass_human_legal_security_or_production_approval

  A2_5_DELIVERY_OFFICE:
    components:
      - PEFY_OFFICE_AGENCY_Ω
    authority:
      - project_intake_and_classification
      - minimum_competent_team_staffing
      - work_graph_and_handoff_coordination
      - project_scoped_memory_coordination
      - evidence_collection_coordination
      - resource_budget_and_backpressure_enforcement
      - incident_and_release_cell_assembly
    prohibited:
      - sovereign_policy_override
      - capability_admission_without_Agent_Manager
      - permanent_unbounded_agent_spawning
      - secret_ownership
      - production_promotion_without_A1_A2_and_human_gates
    rules:
      - one_project_namespace_per_project_or_explicitly_authorized_shared_domain
      - activate_only_the_minimum_competent_team
      - use_project_adapter_contract
      - all_execution_adapters_remain_replaceable

  A3_EXECUTION_RUNTIMES:
    rule: selected_by_A1_policy_per_task_and_admitted_by_Agent_Manager
    families:
      coding_agents:
        primary_candidates:
          - codex
          - claude_code
          - opencode
          - deepseek_harness
        constraints:
          - one_primary_runtime_per_execution_stage
          - one_fallback_maximum_unless_incident_mode
          - benchmark_before_changing_default
          - deepseek_harness_is_experimental_until_pinned_and_qualified
      multi_agent_frameworks:
        candidates:
          - crewAI
          - deer_flow
          - MetaGPT
        constraints:
          - use_only_when_task_benefits_from_role_parallelism_or_decomposition
          - never_nest_multi_agent_frameworks_by_default
          - no_framework_may_override_A1_governance
          - Office_Agency_staffing_does_not_require_a_multi_agent_framework_if_native_agents_suffice
      workflow_automation:
        candidates:
          - n8n
        authority:
          - durable_event_and_integration_workflows
          - scheduled_and_external_system_automation
        prohibited:
          - sovereign_reasoning_authority
          - unreviewed_secret_or_production_mutation
      agent_gateway_personal_runtime:
        candidates:
          - OpenClaw
        authority:
          - channel_gateway
          - session_and_agent_runtime_functions
        prohibited:
          - replacing_A1_control_plane
      secure_sandbox_runtime:
        candidates:
          - NemoClaw
          - NVIDIA_OpenShell
        authority:
          - isolation
          - execution_policy_boundary
          - managed_inference_where_qualified
        prohibited:
          - bypassing_PEFY_security_policy
      agent_development_reference:
        candidates:
          - DeepFlow
        default_state: reference_or_experimental
        promotion_rule: benchmark_and_maintenance_viability_required

  A4_ADAPTERS_TOOLS_SKILLS:
    components:
      - MCP_adapters
      - model_provider_adapters
      - repository_tools
      - sandbox_tools
      - search_retrieval_tools
      - vector_indexes
      - skill_packages
      - office_runtime_adapters
      - project_adapters
    rule: capability_only_no_independent_governance_authority

  A5_DISCOVERY_REFERENCE:
    named_references:
      - munder_difflin
      - agency_agents
    patterns:
      - awesome_*
      - '*-guide'
      - '*-tips'
      - '*-course'
      - '*-examples'
      - '*-templates'
      - '*-marketplace'
      - '*-system-prompts'
      - learning_or_curated_catalogs
    authority: none
    rules:
      - never_auto_install
      - never_auto_execute
      - provenance_review_before_import
      - copy_only_minimum_qualified_capability_or_reimplement_cleanly
      - preserve_license_and_attribution
      - external_office_or_agent_catalogs_do_not_define_PEFY_authority

routing_policy:
  project_office_staffing:
    control: PEFY_OFFICE_AGENCY_Ω
    lifecycle_gate: AGENT_MANAGER
    project_contract: PEFY_PROJECT_ADAPTER
    rule: staff_minimum_competent_cross_functional_cell_then_route_each_execution_stage_to_A3_or_A4

  software_engineering:
    choose_from: [codex, claude_code, opencode, deepseek_harness]
    selection_metrics:
      - task_success_rate
      - code_quality
      - security_gate_pass_rate
      - latency
      - memory
      - token_and_api_cost
      - tool_reliability
      - repo_scale_fit
    default_parallelism: 1
    maximum_fallbacks: 1

  role_based_multi_agent_work:
    choose_from: [crewAI, deer_flow, MetaGPT]
    default_parallelism: bounded_by_task_and_resource_budget
    rule: framework_selected_once_then_subagents_live_inside_that_framework_or_A1_native_pool

  external_workflow_automation:
    choose_from: [n8n]
    rule: use_for_durable_workflow_state_not_for_core_reasoning

  gateway_or_channel_agent:
    choose_from: [OpenClaw]
    rule: keep_gateway_state_separate_from_sovereign_policy_state

  high_isolation_agent_execution:
    choose_from: [NemoClaw, NVIDIA_OpenShell]
    rule: security_boundary_must_remain_enforced_even_if_agent_requests_more_privilege

resource_governor:
  goals:
    - minimize_idle_memory
    - minimize_duplicate_model_contexts
    - minimize_duplicate_vector_indexes
    - minimize_recursive_agent_loops
    - minimize_unnecessary_network_and_api_calls
  rules:
    - lazy_load_execution_runtimes
    - unload_or_suspend_idle_runtimes_where_supported
    - share_read_only_model_and_embedding_services_when_security_tier_allows
    - one_authoritative_vector_index_per_knowledge_domain_unless_isolation_requires_separation
    - cap_subagent_concurrency_by_cpu_gpu_memory_token_and_cost_budget
    - use_smallest_capable_model_for_routine_steps
    - escalate_model_or_framework_only_on_measured_need
    - cache_stable_read_only_results_with_explicit_invalidation
    - apply_backpressure_before_spawning_more_workers
    - never_trade_security_or_correctness_for_memory_reduction

state_separation:
  sovereign_policy_state: A1_only
  capability_lifecycle_state: Agent_Manager_and_governed_registry
  office_staffing_and_task_state: project_scoped_Office_Agency
  execution_session_state: runtime_specific
  durable_workflow_state: workflow_engine
  secrets: approved_secret_manager_only
  evidence: governed_evidence_store
  vector_memory: domain_scoped_and_access_controlled
  trajectories: sensitive_operational_data_with_retention_policy

anti_duplication_decision:
  KEEP: unique_high_value_capability_and_maintainable
  IMPROVE: valuable_but_gap_exists
  INTEGRATE: unique_capability_better_as_adapter
  CONSOLIDATE: overlaps_with_authoritative_component
  REPLACE: materially_inferior_or_unsupported
  DEPRECATE: retained_temporarily_for_migration_or_compatibility
  ARCHIVE: no_longer_required_but_provenance_must_be_retained
  DISCOVERY_ONLY: useful_reference_not_runtime

promotion_rules:
  - no_A5_component_promotes_directly_to_A3
  - every_A3_runtime_requires_Agent_Manager_admission_owner_version_update_policy_security_tier_and_benchmark
  - every_new_framework_must_show_capability_gap_not_already_covered
  - overlapping_frameworks_require_comparative_benchmark_before_both_remain_active
  - external_office_frameworks_cannot_replace_PEFY_OFFICE_AGENCY_Ω_without_A1_architecture_decision
  - production_default_change_requires_release_qualification_matrix_and_PEFY_PRODUCTION_READINESS_GATE
