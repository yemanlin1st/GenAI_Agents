name: PEFY Upstream Drift Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches:
      - governance/portfolio-hardening-2026-08-25
    paths:
      - script/upstream_audit.py
      - governance/UPSTREAM_WATCHLIST.json
      - governance/UPSTREAM_DELTA_LEDGER.yaml
      - governance/UPSTREAM_REMEDIATION_POLICY.md
      - .github/workflows/upstream-drift-audit.yml

permissions:
  contents: read

concurrency:
  group: pefy-upstream-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Read-only upstream portfolio audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile auditor
        run: python -m py_compile script/upstream_audit.py

      - name: Run audit and retain exit code
        id: audit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PEFY_PORTFOLIO_TOKEN: ${{ secrets.PEFY_PORTFOLIO_TOKEN }}
        run: |
          set +e
          python script/upstream_audit.py \
            --watchlist governance/UPSTREAM_WATCHLIST.json \
            --out-dir artifacts/upstream-audit
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show concise report
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/upstream-audit/upstream-audit.md ]; then
            sed -n '1,160p' artifacts/upstream-audit/upstream-audit.md
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pefy-upstream-audit-${{ github.run_id }}
          path: artifacts/upstream-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce audit result
        if: always()
        shell: bash
        run: |
          rc='${{ steps.audit.outputs.exit_code }}'
          if [ -z "$rc" ]; then
            echo 'Audit did not produce an exit code.' >&2
            exit 3
          fi
          if [ "$rc" -ne 0 ]; then
            echo "Audit completed with evidence but returned code $rc." >&2
            exit "$rc"
          fi
